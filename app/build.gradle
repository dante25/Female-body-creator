plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bodycreator.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bodycreator.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // potpisano debug ključem da se APK može odmah instalirati
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // web aplikacija (../web) se pakuje direktno u assets
    sourceSets {
        main.assets.srcDirs += ['../web']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
